name: Feature request
description: An idea, or something ChemDraw (or another tool) does that ChemFox should too.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or figure you're working on, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A sketch, screenshot or file of the result you're after.
